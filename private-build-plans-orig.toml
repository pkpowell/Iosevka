[buildPlans.IosevkaExt]
family = "Iosevka Ext"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.IosevkaExt.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaExt.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaExt.widths.Extended]
shape = 600

[buildPlans.IosevkaExt.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaExt.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
